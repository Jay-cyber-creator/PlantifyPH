<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlantifyPH</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to right, #56ab2f, #a8e063);
            color: #333;
        }
        h1 {
            font-size: 2.5rem;
            text-align: center;
            margin: 20px 0;
        }
        .container {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        button {
            padding: 10px 20px;
            background: linear-gradient(to right, #ff7e5f, #feb47b);
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: linear-gradient(to right, #feb47b, #ff7e5f);
            transform: scale(1.05);
        }
        .form-group {
            margin: 15px 0;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            transition: border 0.3s;
        }
        input:focus, textarea:focus {
            border-color: #56ab2f;
            outline: none;
        }
        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            margin: 20px;
            transition: transform 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #56ab2f;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8e063;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to PlantifyPH</h1>
        <div class="card">
            <h2>Your plants, your passion</h2>
            <form>
                <div class="form-group">
                    <input type="text" placeholder="Your name" required />
                </div>
                <div class="form-group">
                    <textarea rows="4" placeholder="Your message" required></textarea>
                </div>
                <button type="submit">Submit</button>
            </form>
        </div>
    </div>
</body>
</html>
